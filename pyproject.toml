[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "مستودع تمارين وواجبات AIE2026 (تطوير وكيل لدعم التعلم)"
readme = "README.md"
requires-python = ">=3.12"
# تثبيت الإصدارات لتجنب الأعطال خلال سنة المقرر
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # يُستخدم mcp في Lecture 05 (خوادم MCP وعملاؤها)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
